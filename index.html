<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>울산 북구의 박재진이 물어 본 기록</title>
<meta name="description" content="울산 북구 현안을 행정기관에 묻고 받은 답을 지도에서 확인하세요.">
<meta property="og:title" content="울산 북구의 박재진이 물어 본 기록">
<meta property="og:description" content="울산 북구 현안을 행정기관에 묻고 받은 답을 지도에서 확인하세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#1B2230; --muted:#6B7483; --line:#E2E6EC;
  --brand:#2447B8; --brand-soft:#EAF0FF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;word-break:keep-all;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* 상단 바 */
.top{flex:0 0 auto;height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:1001}
.top h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-0.03em;white-space:nowrap}
.badge{font-size:12.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:1px solid #CBD7FA;padding:3px 10px;border-radius:999px;white-space:nowrap}
.top nav{margin-left:auto;display:flex;gap:6px}
.top nav a,.top nav button{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
.top nav a:hover,.top nav button:hover{background:var(--bg)}

.app{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:380px minmax(0,1fr)}

/* 왼쪽 패널 */
.side{overflow:auto;padding:16px;background:var(--bg);border-right:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card h2{margin:0;font-size:16px;font-weight:700}
.card h2 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:4px}
.card h3{margin:16px 0 8px;font-size:13.5px;font-weight:700;color:#454E5E}
.reset{font-size:13px;color:var(--brand);background:none;border:0;cursor:pointer;padding:2px 4px}
.rowf{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.rowf:hover{border-color:#AFC0EE}
.rowf.active{border-color:var(--brand);background:var(--brand-soft)}
.rowf.zero{opacity:.55}
.rowf .n{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.rowf .n::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-top:1.5px solid var(--muted);transform:rotate(45deg)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;padding:3px 10px;border-radius:8px;
  background:color-mix(in srgb,var(--c) 13%,white);color:color-mix(in srgb,var(--c) 78%,black);border:1px solid color-mix(in srgb,var(--c) 32%,white)}
.chip.dong{--c:#3B5BC9}

.search{width:100%;margin:12px 0 10px;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.item{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.item:first-of-type{border-top:0}
.item:hover .it{color:var(--brand)}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 14%,white);border:2px solid var(--c)}
.it{font-weight:700;line-height:1.4;font-size:15px}
.im{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--s)}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s)}
.via{font-size:12.5px;color:#2F6B45;background:#EAF5EE;border-radius:6px;padding:1px 7px}
.empty{padding:18px 4px;color:var(--muted);font-size:14px}
.rules{font-size:13px;color:var(--muted);padding:0 4px 8px}
.rules p{margin:0 0 6px}

/* 지도 */
.mapbox{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#E6EAE3}
.chan{position:absolute;top:16px;left:16px;z-index:500;display:flex;gap:8px;flex-wrap:wrap}
.chan button{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(27,34,48,.14)}
.chan button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.nopin{position:absolute;top:16px;right:16px;z-index:500;width:270px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgba(27,34,48,.16)}
.nopin h4{margin:0 0 8px;font-size:13.5px}
.nopin h4 small{font-weight:500;color:var(--muted)}
.nopin button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 4px;border:0;background:none;text-align:left;cursor:pointer;font-size:13.5px;border-radius:8px}
.nopin button:hover{background:var(--bg)}
.nopin .ic{width:30px;height:30px;font-size:15px;flex:0 0 30px}
.nopin .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{position:absolute;left:16px;bottom:16px;z-index:500;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 32px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--s);display:inline-block}
.report{position:absolute;right:66px;bottom:16px;z-index:500;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 6px 24px rgba(27,34,48,.18)}
.report b{display:block;font-size:15px;margin-bottom:6px;padding-right:24px}
.report p{margin:0;font-size:14px}
.report a{color:var(--ink)}
.report .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;line-height:1}

/* 좌표 찍기 모드 */
.coordbox{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:600;background:#1B2230;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:calc(100% - 32px);flex-wrap:wrap}
.coordbox span{font-variant-numeric:tabular-nums;user-select:all}
.coordbox button{background:#fff;color:#1B2230;border:0;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}

/* 지도 핀 */
.mk{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#fff;border:3px solid var(--c);box-shadow:0 3px 10px rgba(27,34,48,.35);transition:transform .15s}
.mk:hover{transform:scale(1.12)}
.mk.approx{border-style:dashed}
.mk i{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--s);border:2px solid #fff}
.cl-unused{position:relative;width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 3px 12px rgba(27,34,48,.38);display:grid;place-items:center;font-size:14px;letter-spacing:-3px;cursor:pointer}
.cl b{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:12.5px;letter-spacing:0;display:grid;place-items:center;border:2px solid #fff}
.pp .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 8px 28px rgba(27,34,48,.28)}
.pp .leaflet-popup-content{margin:14px 16px;font-family:inherit;font-size:14px;line-height:1.5}
.ppc .ppt{display:block;font-size:15.5px;margin:8px 0 4px;line-height:1.4}
.ppc p{margin:8px 0 10px;color:#3A4352}
.ppb{width:100%;padding:9px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
.ppb:hover{filter:brightness(1.1)}
.steps{list-style:none;margin:12px 0 4px;padding:12px 8px 8px;display:flex;border:1px solid var(--line);border-radius:12px;background:#FAFBFC}
.steps li{flex:1;position:relative;text-align:center;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.steps li::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.cur::before{background:var(--s)}
.steps i{position:relative;z-index:1;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #C9CFD8}
.steps li.done i{background:var(--s);border-color:var(--s)}
.steps li.cur i{border-color:var(--s);box-shadow:inset 0 0 0 4px #fff;background:var(--s)}
.steps li.cur span{color:var(--ink);font-weight:700}
.steps small{font-size:11.5px;color:var(--s);font-weight:700}
.ph{display:grid;gap:4px;margin:8px 0;border-radius:10px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg)}
.ppc .ph1 img{height:150px}
.ppc .ph2{grid-template-rows:1fr 1fr}
.ppc .ph2 img{height:88px}
.d-body .ph{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.d-body .ph img{height:160px;border-radius:8px}
.rdlg{width:min(440px,calc(100% - 24px))}
.rbody{padding:30px 26px 26px;text-align:center}
.remoji{font-size:40px;line-height:1}
.rbody h2{margin:10px 0 6px;font-size:20px}
.rsub{margin:0 0 18px;color:var(--muted);font-size:14px}
.rrow{display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px;text-align:left}
.rrow .rv{flex:1;font-size:16px;font-weight:700;word-break:break-all;user-select:all}
.rrow button,.rrow a{flex:0 0 auto;border:0;border-radius:9px;padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none}
.rrow .cp{background:#fff;border:1px solid var(--line);color:var(--ink)}
.rrow .go{background:var(--brand);color:#fff}
.leaflet-tooltip{font-family:inherit;font-size:13px;border-radius:8px}
.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:34px!important;font-size:20px!important}

/* 상세 */
dialog{border:0;padding:0;width:min(640px,calc(100% - 24px));max-height:88vh;border-radius:18px;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(27,34,48,.3)}
dialog::backdrop{background:rgba(27,34,48,.45)}
.d-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.d-head h2{margin:8px 0 0;font-size:21px;line-height:1.35;letter-spacing:-0.02em}
.stamp{display:grid;place-items:center;width:74px;height:74px;border-radius:50%;border:2.5px solid var(--s);color:var(--s);font-size:13px;font-weight:800;text-align:center;line-height:1.2;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4.5px var(--s);margin-right:26px}
.close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.d-body{padding:4px 24px 24px;overflow:auto}
.meta{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:14px;margin:16px 0;padding:14px 16px;background:var(--bg);border-radius:12px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;font-weight:500}
.sec{margin-top:18px}
.sec h3{font-size:14px;margin:0 0 6px;color:#454E5E}
.sec p{margin:0;white-space:pre-line}
.sec.opinion{background:#FFF8E8;border:1px solid #F1DFB2;padding:12px 14px;border-radius:12px}
.todo{color:var(--muted);font-style:italic;font-weight:400}
.docs a{display:block;color:var(--brand)}

@media (max-width:900px){
  body{display:block;height:auto}
  .top{height:auto;min-height:56px;flex-wrap:wrap;padding:10px 14px;position:sticky;top:0}
  .top h1{font-size:18px}
  .top nav{margin-left:0}
  .app{display:flex;flex-direction:column}
  .mapbox{height:60vh}
  .side{border-right:0}
  .report{width:auto;left:16px;right:16px;bottom:16px}
  .legend{display:none}
  .nopin{position:static;width:auto;margin:12px 16px 0;box-shadow:none}
  .chan button{padding:8px 12px;font-size:13.5px}
  .coordbox{top:auto;bottom:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <h1>울산 북구의 박재진이 물어 본 기록</h1>
  <span class="badge" id="badge"></span>
  <nav>
    <a id="lnkYT" href="#" target="_blank" rel="noopener" hidden>▶ 유튜브</a>
    <a id="lnkFB" href="#" target="_blank" rel="noopener" hidden>ⓕ 페이스북</a>
    <button id="btnReport" type="button">✉ 제보</button>
  </nav>
</header>

<div class="app">
  <aside class="side" aria-label="현황과 목록">
    <section class="card">
      <div class="card-h"><h2>질의 현황<small>(전체 기준)</small></h2><button class="reset" id="reset" hidden>필터 해제</button></div>
      <h3>동별</h3><div id="byDong"></div>
      <h3>분야별</h3><div id="byCat"></div>
      <h3>상태별</h3><div id="byStatus"></div>
    </section>
    <section class="card">
      <div class="card-h"><h2>기록 <small id="listCount"></small></h2></div>
      <input class="search" id="q" type="search" placeholder="제목·기관으로 찾기" aria-label="검색">
      <div id="list"></div>
    </section>
    <div class="rules">
      <p>기관이 회신한 내용과 제 평가는 칸을 나눠 적습니다.</p>
      <p>제가 요청자·당사자인 사안은 항목마다 밝힙니다.</p>
      <p>회신 원문은 담당자 개인정보를 가리고 첨부합니다.</p>
    </div>
  </aside>

  <div class="mapbox">
    <div id="map" aria-label="울산 북구 질의 지도"></div>
    <div class="chan" id="chan" role="group" aria-label="질의 경로"></div>
    <div class="legend" id="legend"></div>
    <div class="nopin" id="nopin" hidden></div>
    <div class="report" id="report">
      <button class="x" id="reportX" aria-label="닫기">×</button>
      <b>북구에 물어볼 일을 알려주세요</b>
      <p id="contact"></p>
    </div>
  </div>
</div>

<dialog id="detail" aria-labelledby="dTitle"></dialog>
<dialog id="reportDlg" class="rdlg" aria-labelledby="rTitle">
  <button class="close" id="rClose" aria-label="닫기">×</button>
  <div class="rbody">
    <div class="remoji" aria-hidden="true">✉️</div>
    <h2 id="rTitle">북구에 물어볼 일을 알려주세요</h2>
    <p class="rsub">동네에서 불편한 점, 행정기관에 묻고 싶은 것을 보내주시면 직접 확인해 기록으로 남기겠습니다.</p>
    <div id="rList"></div>
  </div>
</dialog>

<script>

/* ============================================================
   데이터: 이 부분만 고치면 사이트가 바뀝니다.
   모르는 값은 "" → 화면에 "입력 전". 위치 모르면 lat/lng null.
   좌표 찍기: 주소 뒤에 ?coords 붙여서 열고 지도 클릭.
   ============================================================ */
const SITE = {
  phone: "",    // 예: "010-0000-0000"
  email: "pirose7041@gmail.com",
  youtube: "https://www.youtube.com/@ulsanjj",
  facebook: "https://www.facebook.com/profile.php?id=100007325116844"
};

const RECORDS = [
  {
    id: "2026-diache-flasher",
    category: "traffic",
    title: "디아채 앞 대각선 횡단보도, 심야에는 점멸신호로 운영할 수 있나",
    status: "answered",
    channel: "국민신문고",
    agencies: ["울산북부경찰서 교통관리계"],
    askedAt: "",            // 신청일 입력 (국민신문고 마이페이지)
    answeredAt: "2026-08-27",
    receiptNo: "",
    dong: "",               // 좌표로 자동 판정
    lat: 35.65445, lng: 129.35160, approx: false, // 정문 앞 사거리, ?coords 모드로 직접 확인
    question: `중산디아채 정문 앞 대각선 횡단보도 신호의 야간 운영 방식 재검토 요청. 5개 항목 질의.
① 24시간 정상 운영해야 하는 법령·지침·기준은 무엇인가
② 학교 주변·어린이보호구역이라는 이유만으로 24시간 운영해야 한다는 규정이 있는가
③ 치안정책연구소 연구의 시간제 운영 방안과 달리 판단하는 이유는
④ 울산 전체 어린이보호구역 신호기에도 같은 원칙이 적용되는가
⑤ 해당 지점 오후 6시 이후 보행량 조사 자료가 있는가`,

const DONG_NAMES = DONGS.features.map(f => f.properties.name);
function inRing(x, y, ring){ let c = false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){ const [xi,yi]=ring[i],[xj,yj]=ring[j]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function inPoly(x, y, poly){ return inRing(x,y,poly[0]) && !poly.slice(1).some(h => inRing(x,y,h)); }
function dongAt(lat, lng){
  const f = DONGS.features.find(f => (f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates).some(p => inPoly(lng, lat, p)));
  return f ? f.properties.name : "";
}
const dongOf = r => r.dong || (r.lat != null ? dongAt(r.lat, r.lng) : "");

const $ = s => document.querySelector(s);

const st = r => STATUS[r.status] || STATUS.asked;

/* 상단·제보 */
const replied = RECORDS.filter(r => ["answered","nonexistent","appeal","resolved"].includes(r.status)).length;
$("#badge").textContent = `질의 ${RECORDS.length}건 · 회신 ${replied}건`;

$("#reportDlg").addEventListener("click", e => {
  if(e.target.id === "reportDlg") return e.target.close();
  const b = e.target.closest(".cp"); if(!b) return;
  navigator.clipboard?.writeText(b.dataset.copy).then(() => b.textContent = "복사됨", () => b.textContent = "길게 눌러 복사");
});

/* 필터 */
function match(r, skip){
  return (skip==="dong" || !F.dong || dongOf(r) === F.dong || (F.dong === "북구 전체" && r.dong === "북구 전체"))
      && (skip==="cat" || !F.cat || r.category === F.cat)
      && (skip==="status" || !F.status || r.status === F.status)
      && (!F.channel || r.channel === F.channel)
      && (!F.q || (r.title + r.agencies.join(" ")).includes(F.q));
}
const shown = () => RECORDS.filter(r => match(r));
function setF(k, v){ F[k] = (F[k] === v ? "" : v); render(); if(k === "dong") focusDong(); }

function rowsHTML(kind, entries){
  return entries.map(([key, chip, n]) =>
    `<button class="rowf${F[kind]===key?" active":""}${n?"":" zero"}" data-k="${kind}" data-v="${esc(key)}" aria-pressed="${F[kind]===key}">${chip}<span class="n">${n}건</span></button>`).join("");
}
function renderStats(){
  const cnt = fn => RECORDS.filter(fn).length;
  $("#byDong").innerHTML = rowsHTML("dong", [...DONG_NAMES, "북구 전체"].map(d =>
    [d, `<span class="chip dong">${esc(d)}</span>`, cnt(r => d === "북구 전체" ? r.dong === "북구 전체" : dongOf(r) === d)]));
  $("#byCat").innerHTML = rowsHTML("cat", Object.entries(CATEGORY).map(([k,c]) =>
    [k, `<span class="chip" style="--c:${c.color}">${c.icon} ${esc(c.label)}</span>`, cnt(r => r.category === k)]));
  $("#byStatus").innerHTML = rowsHTML("status", Object.entries(STATUS).map(([k,s]) =>
    [k, `<span class="chip" style="--c:${s.color}">${esc(s.label)}</span>`, cnt(r => r.status === k)]));
  $("#reset").hidden = !Object.values(F).some(Boolean);
}
$(".side").addEventListener("click", e => {
  const b = e.target.closest(".rowf"); if(b) return setF(b.dataset.k, b.dataset.v);
  const it = e.target.closest(".item"); if(it) openDetail(it.dataset.id, true);
});
$("#reset").onclick = () => { Object.keys(F).forEach(k => F[k] = ""); $("#q").value = ""; render(); focusDong(); };
$("#q").addEventListener("input", e => { F.q = e.target.value.trim(); render(); });

function renderList(rows){
  $("#listCount").textContent = `${rows.length}건`;
  $("#list").innerHTML = rows.length ? rows.map(r => { const c = cat(r), s = st(r); return `
    <button class="item" data-id="${esc(r.id)}">
      <span class="ic" style="--c:${c.color}" aria-hidden="true">${c.icon}</span>
      <span>
        <span class="it">${esc(r.title)}</span>
        <span class="im">
          <span class="st" style="--s:${s.color}">${esc(s.label)}</span>
          <span>${esc(r.agencies.join(", "))}</span>
          <span>${r.askedAt ? esc(r.askedAt.replaceAll("-",".")) : "날짜 입력 전"}</span>
          ${r.via ? `<span class="via">${esc(r.via.name)} ${esc(r.via.role)} 통해 해결 중</span>` : ""}
        </span>
      </span>
    </button>`; }).join("") : `<p class="empty">조건에 맞는 기록이 없습니다. 필터를 해제해 보세요.</p>`;
}

/* 질의 경로 버튼 */
function renderChan(){
  const chans = [...new Set(RECORDS.map(r => r.channel).filter(Boolean))];
  $("#chan").innerHTML = [["", "🗂", "전체"], ...chans.map(c => [c, CHANNEL_ICON[c] || "•", c])]
    .map(([v,i,l]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${F.channel===v}">${i} ${esc(l)}</button>`).join("");
}
$("#chan").addEventListener("click", e => { const b = e.target.closest("button"); if(b){ F.channel = b.dataset.v; render(); } });
$("#legend").innerHTML = Object.values(STATUS).map(s => `<span><i style="--s:${s.color}"></i>${esc(s.label)}</span>`).join("") + "<span>점선 테두리: 대략 위치</span>";

/* 상세 */
function openDetail(id, fly){
  const r = RECORDS.find(x => x.id === id); if(!r) return;
  const c = cat(r), s = st(r);
  if(fly && map && r.lat != null) map.flyTo([r.lat, r.lng], 15, { duration:.6 });
  const d = $("#detail");
  d.innerHTML = `
    <button class="close" aria-label="닫기">×</button>
    <div class="d-head">
      <div><span class="chip" style="--c:${c.color}">${c.icon} ${esc(c.label)}</span><h2 id="dTitle">${esc(r.title)}</h2></div>
      <span class="stamp" style="--s:${s.color}">${s.stamp}</span>
    </div>
    <div class="d-body">
      ${stepsHTML(r)}
      ${photosHTML(r)}
      <dl class="meta">
        <dt>질의 경로</dt><dd>${orTodo(r.channel)}</dd>
        <dt>대상 기관</dt><dd>${orTodo(r.agencies.join(", "))}</dd>
        <dt>질의일</dt><dd>${orTodo(r.askedAt)}</dd>
        <dt>회신일</dt><dd>${orTodo(r.answeredAt)}</dd>
        <dt>접수번호</dt><dd>${orTodo(r.receiptNo)}</dd>
        <dt>위치</dt><dd>${orTodo(dongOf(r))}${r.approx ? " (대략 위치)" : ""}</dd>
        <dt>저와의 관계</dt><dd>${orTodo(r.myRole)}</dd>
        <dt>해결 경로</dt><dd>${r.via ? `${esc(r.via.name)} ${esc(r.via.role)}${r.via.note ? ` / ${esc(r.via.note)}` : ""}` : '<span class="todo">연결된 의원 없음</span>'}</dd>
      </dl>
      <div class="sec"><h3>무엇을 물었나</h3><p>${orTodo(r.question)}</p></div>
      <div class="sec"><h3>받은 답</h3><p>${orTodo(r.answer)}</p></div>
      ${r.opinion ? `<div class="sec opinion"><h3>박재진의 평가</h3><p>${esc(r.opinion)}</p></div>` : ""}
      <div class="sec"><h3>다음 할 일</h3><p>${orTodo(r.next)}</p></div>
      <div class="sec docs"><h3>원문</h3>${r.docs.length ? r.docs.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">📎 ${esc(x.label)}</a>`).join("") : '<p class="todo">첨부 전</p>'}</div>
    </div>`;
  d.querySelector(".close").onclick = () => d.close();
  d.showModal();
}
$("#nopin").addEventListener("click", e => { const b = e.target.closest("button"); if(b) openDetail(b.dataset.id, false); });
$("#detail").addEventListener("click", e => { if(e.target.id === "detail") e.target.close(); });

/* 지도 */
let map, pins, dongLayer, popupClosedAt = 0;
const COORDS = new URLSearchParams(location.search).has("coords");
const BASE = { color:"#2447B8", weight:2.5, opacity:.85, fillColor:"#2447B8", fillOpacity:.03 };
const HOT  = { weight:4, opacity:1, fillOpacity:.16 };
function initMap(){
  if(typeof L === "undefined"){ $("#map").innerHTML = '<p class="empty" style="padding:20px">지도를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</p>'; return; }
  map = L.map("map", { zoomControl:false, scrollWheelZoom:true });
  L.control.zoom({ position:"bottomright" }).addTo(map);
  L.tileLayer("https://tiles.osm.kr/hot/{z}/{x}/{y}.png", { maxZoom:18,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자, OSM Korea / 행정동 경계 vuski/admdongkor' }).addTo(map);
  dongLayer = L.geoJSON(DONGS, { interactive: !COORDS, style: () => BASE, onEachFeature: (f, l) => {
    if(COORDS) return;
    const name = f.properties.name;
    l.bindTooltip(() => `<b>${esc(name)}</b> 기록 ${RECORDS.filter(r => dongOf(r) === name).length}건`, { sticky:true });
    l.on({ mouseover: () => l.setStyle(HOT), mouseout: () => { if(F.dong !== name) l.setStyle(BASE); }, click: () => { if(Date.now() - popupClosedAt < 400) return; setF("dong", name); } });
  }}).addTo(map);
  pins = L.layerGroup().addTo(map);
  map.on("zoomend", () => renderPins(lastRows));
  map.on("popupclose", () => popupClosedAt = Date.now());
  map.getContainer().addEventListener("click", e => { const b = e.target.closest(".ppb"); if(b){ map.closePopup(); openDetail(b.dataset.id, false); } });
  map.fitBounds(dongLayer.getBounds(), { padding:[20,20] });
  if(COORDS){
    const box = document.createElement("div");
    box.className = "coordbox";
    box.innerHTML = '<b>좌표 찍기 모드</b><span id="cbText">지도에서 위치를 클릭하세요</span><button type="button" id="cbCopy" hidden>복사</button>';
    $(".mapbox").appendChild(box);
    $("#map").style.cursor = "crosshair";
    let mark;
    map.on("click", e => {
      const t = `lat: ${e.latlng.lat.toFixed(5)}, lng: ${e.latlng.lng.toFixed(5)}`;
      const dn = dongAt(e.latlng.lat, e.latlng.lng) || "북구 밖";
      $("#cbText").textContent = `${t}  (${dn})`;
      $("#cbCopy").hidden = false;
      $("#cbCopy").onclick = () => navigator.clipboard.writeText(t).then(() => $("#cbCopy").textContent = "복사됨", () => $("#cbCopy").textContent = "직접 드래그해서 복사");
      if(mark) mark.remove();
      mark = L.circleMarker(e.latlng, { radius:8, color:"#C23A2F", weight:3, fillOpacity:.4 }).addTo(map);
    });
  }
}
function focusDong(){
  if(!dongLayer) return;
  let target = null;
  dongLayer.eachLayer(l => { const on = F.dong === l.feature.properties.name; l.setStyle(on ? HOT : BASE); if(on) target = l; });
  map.flyToBounds(target ? target.getBounds() : dongLayer.getBounds(), { padding:[30,30], duration:.6 });
}
let lastRows = [];
function pinHTML(r){ const c = cat(r), s = st(r);
  return `<div class="mk${r.approx?" approx":""}" style="--c:${c.color};--s:${s.color}">${c.icon}<i></i></div>`; }
function renderPins(rows){
  if(!map) return;
  lastRows = rows;
  pins.clearLayers();
  const pts = rows.filter(r => r.lat != null && r.lng != null).map(r => ({ r, p: map.latLngToLayerPoint([r.lat, r.lng]) }));
  const groups = [];
  pts.forEach(pt => {                       // 화면상 44px 안에 겹치는 핀은 묶음으로
    const g = groups.find(g => g.some(x => x.p.distanceTo(pt.p) < 44));
    g ? g.push(pt) : groups.push([pt]);
  });
  const off = rows.filter(r => r.lat == null || r.lng == null);
  $("#nopin").hidden = !off.length;
  $("#nopin").innerHTML = off.length ? `<h4>지도에 위치가 없는 기록 <small>${off.length}건</small></h4>` + off.map(r => { const c = cat(r);
    return `<button type="button" data-id="${esc(r.id)}"><span class="ic" style="--c:${c.color}">${c.icon}</span><span class="t">${esc(r.title)}</span></button>`; }).join("") : "";
  groups.forEach(g => {
    g.forEach((x, i) => {                   // 겹치면 원형으로 살짝 벌려서 전부 보이게
      const n = g.length, R = n > 1 ? 24 + 4*n : 0;
      const cx = g.reduce((t,y) => t + y.p.x, 0) / n, cy = g.reduce((t,y) => t + y.p.y, 0) / n;
      let vx = x.p.x - cx, vy = x.p.y - cy, len = Math.hypot(vx, vy);
      if(len < 1){ const ang = -Math.PI/2 + 2*Math.PI*i/n; vx = Math.cos(ang); vy = Math.sin(ang); len = 1; } // 같은 위치면 원형 배치
      const dx = Math.round(R*vx/len), dy = Math.round(R*vy/len); // 실제 방향 유지한 채 벌리기
      const r = x.r, c = cat(r), s = st(r);
      L.marker([r.lat, r.lng], { icon: L.divIcon({ className:"", iconSize:[42,42], iconAnchor:[21-dx, 21-dy], popupAnchor:[dx, dy-18], tooltipAnchor:[dx, dy-18], html: pinHTML(r) }),
          title:r.title, riseOnHover:true, keyboard:true })
        .bindTooltip(`${c.icon} ${esc(r.title)}`, { direction:"top" })
        .bindPopup(popupHTML(r), { maxWidth:320, minWidth:260, className:"pp", autoPanPaddingTopLeft:[20,100], autoPanPaddingBottomRight:[300,20] })
        .addTo(pins);
    });
  });
}
function stepsHTML(r){
  const k = r.status;
  const mid = { answered:"회신", nonexistent:"정보 없음", appeal:"이의신청", silent:"답 없음" }[k] || "회신";
  const cur = k === "asked" ? 0 : k === "resolved" ? 2 : 1;
  const col = st(r).color;
  return `<ol class="steps" style="--s:${col}">` + ["질의", mid, "해결"].map((t,i) =>
    `<li class="${i < cur ? "done" : i === cur ? "cur" : ""}"><i></i><span>${esc(t)}</span>${i === cur ? "<small>현재</small>" : ""}</li>`).join("") + `</ol>`;
}
function photosHTML(r, max){
  const ps = (r.photos || []).slice(0, max || 99);
  return ps.length ? `<div class="ph ph${ps.length > 1 ? 2 : 1}">` + ps.map(u => `<img src="${esc(u)}" alt="${esc(r.title)} 현장 사진" loading="lazy">`).join("") + `</div>` : "";
}
function popupHTML(r){
  const c = cat(r), s = st(r);
  const ans = (r.answer || "").replace(/\n/g," ");
  return `<div class="ppc">
    <span class="chip" style="--c:${c.color}">${c.icon} ${esc(c.label)}</span>
    <b class="ppt">${esc(r.title)}</b>
    ${photosHTML(r, 2)}
    ${stepsHTML(r)}
    <div class="im"><span class="st" style="--s:${s.color}">${esc(s.label)}</span><span>${esc(r.agencies.join(", ") || "기관 입력 전")}</span><span>${esc(dongOf(r))}</span></div>
    <p>${ans ? esc(ans.length > 110 ? ans.slice(0,110) + "…" : ans) : '<span class="todo">받은 답 입력 전</span>'}</p>
    <button type="button" class="ppb" data-id="${esc(r.id)}">전체 내용 보기</button>
  </div>`;
}

function render(){ const rows = shown(); renderStats(); renderChan(); renderList(rows); renderPins(RECORDS.filter(r => match(r, "dong"))); }
initMap();
render();
</script>
